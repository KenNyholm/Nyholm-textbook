name: Render and Deploy Textbook

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  render-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nyholm-textbook
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book to HTML
        run: quarto render --to html --output-dir _book

      - name: Checkout KenNyholm.github.io
        uses: actions/checkout@v4
        with:
          repository: KenNyholm/KenNyholm.github.io
          token: ${{ secrets.PAGES_PAT }}
          path: main-site
          ref: gh-pages

      - name: Copy rendered book into textbook/ folder
        run: |
          rm -rf main-site/textbook
          mkdir -p main-site/textbook
          cp -r _book/. main-site/textbook/

      - name: Commit and push to KenNyholm.github.io
        run: |
          cd main-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f textbook/
          git diff --staged --quiet || git commit -m "Update textbook from Nyholm-textbook [auto]"
          git push

      - name: Trigger GitHub Pages deployment
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.PAGES_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/KenNyholm/KenNyholm.github.io/pages/builds
